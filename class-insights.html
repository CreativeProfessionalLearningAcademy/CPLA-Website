<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPLA — Class Insights</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --navy:#01123a;--navy2:#0a1c44;--blue:#1a56c4;--blue-tint:#e8f0fe;
  --gold:#da9e2b;--gold-tint:#fbf3e0;--ink:#1a1410;--paper:#faf7f2;--cream:#f0ead8;
  --rule:#d4c9b8;--mid:#6b5e52;--green:#2d7a1a;--green-tint:#f0fae8;--red:#dc2626;--red-tint:#fee2e2;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:'DM Sans',system-ui,sans-serif;font-weight:300;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;}
h1,h2,h3{font-family:'Playfair Display',serif;}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--mid);font-size:14px;background:var(--cream);z-index:50;}
.spinner{width:34px;height:34px;border:3px solid var(--rule);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}

.app{display:grid;grid-template-columns:64px 1fr;height:100vh;overflow:hidden;}
/* rail */
.rail{background:linear-gradient(180deg,var(--navy),#000a22);display:flex;flex-direction:column;align-items:center;padding:12px 8px;gap:6px;}
.rail .brand{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--gold),#b8791a);color:var(--navy);display:grid;place-items:center;font-family:'Playfair Display';font-weight:900;font-size:18px;margin-bottom:8px;}
.rail-btn{width:46px;height:46px;border:0;border-radius:12px;background:transparent;color:#aeb8c4;display:grid;place-items:center;font-size:21px;position:relative;cursor:pointer;text-decoration:none;transition:.13s;}
.rail-btn:hover{background:var(--navy2);color:#fff;}
.rail-btn.active{background:var(--navy2);color:var(--gold);}
.rail-btn .tip{position:absolute;left:56px;background:var(--navy);color:#fff;font-size:11px;font-weight:600;padding:5px 9px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transform:translateX(-4px);transition:.12s;z-index:60;box-shadow:0 8px 20px rgba(0,0,0,.25);}
.rail-btn:hover .tip{opacity:1;transform:translateX(0);}
.rail-spacer{flex:1;}
/* main */
.main{min-width:0;display:flex;flex-direction:column;overflow:hidden;}
.statusbar{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--rule);padding:10px 20px;flex-shrink:0;}
.sb-logo img{height:26px;display:block;}
.sb-sep{color:var(--rule);}
.sb-status .lbl{font-family:'DM Mono';font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);}
.sb-status .val{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;}
.sb-status select{font-family:'DM Sans';font-size:13px;font-weight:600;border:1px solid var(--rule);border-radius:8px;padding:5px 9px;background:#fff;color:var(--ink);cursor:pointer;}
.sb-r{margin-left:auto;display:flex;align-items:center;gap:11px;}
.sb-role{font-family:'DM Mono';font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--mid);border:1px solid var(--rule);border-radius:20px;padding:4px 10px;}
.sb-name{font-size:12.5px;font-weight:600;}
.sb-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#1a3a78,#02163f);color:#fff;display:grid;place-items:center;font-weight:800;font-size:11px;}
.sb-signout{border:1px solid var(--rule);background:#fff;color:var(--mid);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:15px;display:grid;place-items:center;}
.sb-signout:hover{color:var(--red);border-color:#e6b0b0;}
.canvas{flex:1;overflow:auto;padding:20px 24px 60px;}
.wrap{max-width:1080px;margin:0 auto;}

.card{background:#fff;border:1px solid var(--rule);border-radius:13px;box-shadow:0 4px 16px rgba(1,18,58,.05);}
.pad{padding:20px 24px;}
.sec-label{font-family:'DM Mono';font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#b8791a;font-weight:500;margin:28px 0 12px;display:flex;align-items:center;gap:10px;}
.sec-label::after{content:"";flex:1;height:1px;background:var(--rule);}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.stat{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:16px 18px;}
.stat .n{font-family:'Playfair Display';font-size:32px;font-weight:900;color:var(--navy);line-height:1;}
.stat .n.blue{color:var(--blue);}.stat .n.gold{color:#b8791a;}.stat .n.green{color:var(--green);}
.stat .k{font-family:'DM Mono';font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);margin-top:8px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.chartcard{background:#fff;border:1px solid var(--rule);border-radius:13px;padding:16px 18px;}
.chartcard h3{font-family:'DM Sans';font-size:14px;font-weight:700;}
.chartcard .sub{font-size:11.5px;color:var(--mid);margin:2px 0 12px;}
.chartwrap{position:relative;height:230px;}
.bars{display:flex;flex-direction:column;gap:9px;}
.bar{display:grid;grid-template-columns:150px 1fr 40px;align-items:center;gap:10px;font-size:12px;}
.bar .lb{color:#2a2218;text-align:right;line-height:1.2;}
.bar .track{background:var(--cream);border-radius:6px;height:16px;overflow:hidden;}
.bar .fill{height:100%;background:var(--blue);border-radius:6px;}
.bar .fill.gold{background:var(--gold);}.bar .fill.green{background:var(--green);}.bar .fill.navy{background:var(--navy);}
.bar .vl{font-family:'DM Mono';font-size:11px;color:var(--mid);}
.dom{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;margin-bottom:12px;}
.dom .dname{font-weight:700;font-size:13px;}
.dom .dsub{font-size:10.5px;color:var(--mid);}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--rule);}
.stack span{display:block;height:100%;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mid);margin-top:4px;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle;}
.insights{background:var(--gold-tint);border:1px solid #ecd9a8;border-radius:13px;padding:20px 24px;}
.insights h3{font-size:18px;font-weight:800;margin-bottom:4px;}
.insights .sub{font-size:12px;color:#7a5f1a;margin-bottom:14px;}
.ins{display:flex;gap:12px;padding:11px 0;border-bottom:1px dashed #e6d3a0;}
.ins:last-child{border-bottom:none;}
.ins .ic{width:26px;height:26px;border-radius:7px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-size:13px;flex-shrink:0;font-weight:700;}
.ins .tx{font-size:13px;color:#2a2218;line-height:1.5;}
.ins .tx b{font-weight:700;color:var(--ink);}
.flags{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.flag{border-radius:12px;padding:15px 17px;border:1px solid var(--rule);background:#fff;}
.flag.support{background:var(--red-tint);border-color:#f0c0c0;}
.flag.challenge{background:var(--blue-tint);border-color:#bcd0f5;}
.flag.mentor{background:var(--green-tint);border-color:#bfe0ad;}
.flag .ft{font-family:'DM Mono';font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:500;margin-bottom:3px;}
.flag.support .ft{color:#a12525;}.flag.challenge .ft{color:var(--blue);}.flag.mentor .ft{color:var(--green);}
.flag .fd{font-size:11px;color:var(--mid);margin-bottom:9px;line-height:1.4;}
.flag ul{list-style:none;display:flex;flex-direction:column;gap:4px;}
.flag li{font-size:12.5px;color:#2a2218;padding-left:14px;position:relative;}
.flag li::before{content:"›";position:absolute;left:0;color:var(--mid);font-weight:700;}
.flag .none{font-size:12px;color:var(--mid);font-style:italic;}
table.roster{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;border:1px solid var(--rule);border-radius:12px;overflow:hidden;}
table.roster th{font-family:'DM Mono';font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--mid);font-weight:500;text-align:left;padding:10px 12px;background:var(--cream);border-bottom:1px solid var(--rule);cursor:pointer;white-space:nowrap;}
table.roster td{padding:9px 12px;border-bottom:1px dashed var(--rule);}
table.roster tr:last-child td{border-bottom:none;}
.tagdot{font-size:11px;margin-right:3px;}
details.qd{background:#fff;border:1px solid var(--rule);border-radius:12px;margin-top:10px;overflow:hidden;}
details.qd summary{padding:13px 18px;cursor:pointer;font-weight:700;font-size:13.5px;list-style:none;display:flex;align-items:center;gap:10px;}
details.qd summary::-webkit-details-marker{display:none;}
details.qd summary .cn{margin-left:auto;font-family:'DM Mono';font-size:11px;color:var(--mid);}
.qblock{padding:4px 18px 16px;border-top:1px solid var(--rule);}
.qitem{padding:11px 0;border-bottom:1px dashed var(--rule);}
.qitem:last-child{border-bottom:none;}
.qq{font-size:12.5px;font-weight:600;margin-bottom:7px;}
.qq .qn{font-family:'DM Mono';font-size:10px;color:var(--mid);margin-right:6px;}
.obar{display:grid;grid-template-columns:1fr 70px;gap:8px;align-items:center;margin-bottom:2px;font-size:11.5px;}
.obar .otext{color:#2a2218;}
.obar.correct .otext{color:var(--green);font-weight:700;}
.obar .otrack{background:var(--cream);border-radius:5px;height:12px;overflow:hidden;margin:2px 0 6px;}
.obar .ofill{height:100%;background:#c9d4e8;border-radius:5px;}
.obar.correct .ofill{background:var(--green);}.obar.unsure .ofill{background:var(--gold);}
.obar .ov{font-family:'DM Mono';font-size:10.5px;color:var(--mid);text-align:right;}
.ck{color:var(--green);font-weight:800;}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;}
.btn{font-family:'DM Sans';font-weight:700;font-size:13px;border-radius:9px;padding:11px 18px;border:1px solid var(--navy);cursor:pointer;}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy);}
.btn.ghost{background:#fff;color:var(--navy);}.btn.ghost:hover{background:var(--cream);}
.empty{display:grid;place-items:center;min-height:40vh;text-align:center;color:var(--mid);font-size:13px;}
.foot{margin-top:26px;font-family:'DM Mono';font-size:10px;color:var(--mid);text-align:center;line-height:1.6;}
@media(max-width:820px){.stats,.flags{grid-template-columns:1fr;}.grid2{grid-template-columns:1fr;}.bar{grid-template-columns:110px 1fr 36px;}.dom{grid-template-columns:1fr;}}
@media print{.rail,.actions{display:none;}.app{display:block;height:auto;}.canvas{overflow:visible;}}
</style>
</head>

    <div class="canvas"><div class="wrap" id="dashWrap"></div></div>
  </div>
</div>

<script>
/* auth & db come from firebase-config.js (shared session with the rest of the console) */

/* ===== Instrument (mirrors assessment.html) ===== */
const PARTS=[{t:"Your Experience & Interests"},{t:"Design Knowledge"},{t:"Illustrator & Vector Graphics"},{t:"Photoshop & Digital Images"},{t:"InDesign, Layout & Acrobat"},{t:"Photography"},{t:"Digital Workflow & Problem Solving"},{t:"How You Learn"},{t:"Your Goals"}];
const Q=[
 {id:1,part:1,type:'single',q:"Before this class, how much experience have you had with graphic design?",o:["None","A little — mostly for fun or school projects","Some — I have created several designs","Quite a bit — I regularly create design work","I have done paid or professional design work"]},
 {id:2,part:1,type:'multi',q:"Which of these have you created before?",o:["Poster or flyer","Logo","Social media graphic","Photograph that I intentionally edited","Video","Website or web graphic","Yearbook or publication page","Illustration or digital artwork","Business card or other printed piece","None of these yet"]},
 {id:3,part:1,type:'single',q:"Which area are you MOST interested in learning about?",o:["Graphic design","Photography","Illustration","Photo editing","Typography and page layout","Branding and logo design","Video / motion graphics","Printing and production","Web / digital media","I'm not sure yet"]},
 {id:4,part:1,type:'single',q:"Have you used any Adobe Creative Cloud applications before?",o:["Never","Once or twice","Occasionally","Frequently","I use Adobe applications regularly"]},
 {id:5,part:1,type:'multi',q:"Which applications have you used before?",o:["Adobe Photoshop","Adobe Illustrator","Adobe InDesign","Adobe Lightroom","Adobe Acrobat","Adobe Premiere Pro","Adobe After Effects","Other Adobe applications","I have never used Adobe software"]},
 {id:6,part:2,type:'single',q:"Which statement best describes graphic design?",o:["Arranging elements so a design looks attractive","Communicating a clear message to a specific audience","Drawing pictures and artwork on the computer","Making advertisements that persuade an audience","I'm not sure yet"]},
 {id:7,part:2,type:'single',q:"What does \"contrast\" generally mean in design?",o:["Keeping the visual elements looking similar","Creating noticeable differences between elements","Making the overall design look darker and heavier","Adding as many bright colors as you possibly can","I'm not sure yet"]},
 {id:8,part:2,type:'single',q:"Why is alignment important in a design?",o:["It organizes elements into clear relationships","It makes the elements look considerably larger","It lets you include many more colors at once","It sets the final resolution of the exported image","I'm not sure yet"]},
 {id:9,part:2,type:'single',q:"\"Negative space\" refers to:",o:["A visible mistake left within a finished design","The solid black areas found inside a photograph","The empty space around and between the elements","A photograph that turned out badly underexposed","I'm not sure yet"]},
 {id:10,part:2,type:'single',q:"Visual hierarchy helps a viewer:",o:["Notice the most important information first","Determine the final size of the saved file","Send the design to a printer correctly","Choose which typeface to use for the text","I'm not sure yet"]},
 {id:11,part:2,type:'single',q:"TRUE or FALSE: A successful design must always be visually complicated to attract attention.",o:["True","False","I'm not sure"]},
 {id:12,part:2,type:'single',q:"When designing a poster for an event, which should you consider FIRST?",o:["Which effects you could create in Photoshop","Who needs to see it and what they must know","How many different fonts you can use on it","Whether you can fit everything on the page","I'm not sure yet"]},
 {id:13,part:3,type:'single',q:"Adobe Illustrator is primarily used to create and edit:",o:["Vector graphics and illustrations","Video footage and motion clips","Spreadsheets and data tables","Audio tracks and sound files","I'm not sure yet"]},
 {id:14,part:3,type:'single',q:"Which would usually be the BEST reason to create a logo as a vector graphic?",o:["It can be scaled to any size without losing quality","It automatically adds photographs to the artwork","It always uses far fewer colors than other files","It can be printed but never shown on a screen","I'm not sure yet"]},
 {id:15,part:3,type:'single',q:"In Illustrator, an anchor point is associated with:",o:["A point along a vector path","The exposure of a photograph","A paragraph of body text","A clip on a video timeline","I'm not sure yet"]},
 {id:16,part:3,type:'single',q:"TRUE or FALSE: A vector graphic can normally be enlarged significantly without becoming pixelated.",o:["True","False","I'm not sure"]},
 {id:17,part:3,type:'single',q:"Which Illustrator tool would you expect to use to create or edit precise vector paths?",o:["Pen Tool","Crop Tool","Hand Tool","Type Tool","I'm not sure yet"]},
 {id:18,part:4,type:'single',q:"Adobe Photoshop is primarily designed for working with:",o:["Raster, pixel-based images and photos","Multi-page documents and print layouts","Spreadsheets and numerical data tables","Audio recordings and sound editing","I'm not sure yet"]},
 {id:19,part:4,type:'single',q:"What is a pixel?",o:["A tiny individual unit of a raster image","A type of lens used on a digital camera","A machine that prints finished photos","An anchor point on a vector path","I'm not sure yet"]},
 {id:20,part:4,type:'single',q:"What is the primary purpose of layers in Photoshop?",o:["To keep parts of an image separately editable","To increase the brightness of the monitor","To automatically improve every photograph","To print several copies of the document","I'm not sure yet"]},
 {id:21,part:4,type:'single',q:"TRUE or FALSE: Editing a photograph always permanently changes the original image file.",o:["True","False","I'm not sure"]},
 {id:22,part:4,type:'single',q:"To remove a photo's background while keeping the subject editable, which concept is most useful?",o:["Masking","Spell check","Page numbering","Vector tracing","I'm not sure yet"]},
 {id:23,part:4,type:'single',q:"If a small raster image is enlarged far beyond its original size, what will most likely happen?",o:["It may become blurry or pixelated","It automatically becomes sharper","It becomes a vector","Nothing changes","I'm not sure yet"]},
 {id:24,part:5,type:'single',q:"Adobe InDesign is primarily used for:",o:["Designing multi-page layouts and publications","Editing and retouching digital photographs","Creating motion graphics and video effects","Recording and editing audio for projects","I'm not sure yet"]},
 {id:25,part:5,type:'single',q:"Which project would most naturally be created in InDesign?",o:["A 24-page magazine","Retouching a portrait","Drawing a vector logo","Editing a video","I'm not sure yet"]},
 {id:26,part:5,type:'single',q:"Why would a designer use margins and guides when creating a page layout?",o:["To position content consistently on the page","To make the photographs look much sharper","To add special visual effects to the design","To change the computer screen's resolution","I'm not sure yet"]},
 {id:27,part:5,type:'single',q:"TRUE or FALSE: Using many different fonts usually makes a design more professional.",o:["True","False","I'm not sure"]},
 {id:28,part:5,type:'single',q:"Adobe Acrobat is commonly used to work with:",o:["PDF documents","RAW camera files","Vector illustrations","Video projects","I'm not sure yet"]},
 {id:29,part:5,type:'single',q:"Why might a designer create a PDF before sending a project to a printer or client?",o:["To package it into a shareable, viewable format","To convert every image in it into a photograph","To automatically redesign the whole layout","To strip all of the fonts out of the file","I'm not sure yet"]},
 {id:30,part:6,type:'single',q:"How much experience do you have taking photographs intentionally?",o:["None","Very little","Some","Quite a bit","Photography is already a serious interest of mine"]},
 {id:31,part:6,type:'single',q:"Have you ever used a DSLR or mirrorless camera?",o:["Never","I have held / used one a few times","I understand some controls","I can operate one in manual or semi-manual modes","I use one confidently"]},
 {id:32,part:6,type:'single',q:"Which three settings are commonly associated with controlling photographic exposure?",o:["Aperture, shutter speed, and ISO","Focus, crop, and zoom","Brightness, contrast, and saturation","Red, green, and blue","I'm not sure yet"]},
 {id:33,part:6,type:'single',q:"Changing shutter speed can affect:",o:["How motion is captured in the photograph","Which typeface is used for the caption","The size of the margins on the page","The anchor points on a vector path","I'm not sure yet"]},
 {id:34,part:6,type:'single',q:"Aperture can affect which of the following?",o:["The exposure and the depth of field","The way the image files are named","The physical size of a printed page","The typography used within a layout","I'm not sure yet"]},
 {id:35,part:6,type:'single',q:"TRUE or FALSE: A good photograph depends only on having an expensive camera.",o:["True","False","I'm not sure"]},
 {id:36,part:6,type:'single',q:"When composing a photograph, what does \"composition\" refer to?",o:["How elements are arranged in the frame","The particular brand of camera being used","The storage capacity of the memory card","The file name given to the saved photograph","I'm not sure yet"]},
 {id:37,part:7,type:'single',q:"You have worked on a Photoshop project for 45 minutes and suddenly realize you may have made a serious mistake. What would be the BEST working habit?",o:["Keep working and hope the problem fixes itself","Close the program right away without saving it","Use edit history and saved versions to recover","Delete the whole project and begin it again","Ask another person to step in and finish it","I'm not sure what I would do"]},
 {id:38,part:7,type:'single',q:"A client asks you to make a logo \"bigger,\" but the only file provided is a tiny, blurry JPEG. What would you do FIRST?",o:["Enlarge the small file until it fills the space","Ask whether a higher-quality or vector file exists","Keep sharpening it until it looks acceptable","Design a brand-new logo without asking first","I'm not sure what I would do"]},
 {id:39,part:7,type:'single',q:"You're given an assignment but aren't sure how to begin. MOST like you?",o:["Start experimenting immediately","Research examples and gather ideas first","Ask the teacher what the first step should be","Make a written plan before starting","Talk through ideas with another student","I usually struggle to get started"]},
 {id:40,part:7,type:'single',q:"You try something and it doesn't work. MOST likely to do?",o:["Try another approach","Undo and try again","Ask another student","Ask the instructor","Search for instructions or a tutorial","Become frustrated and stop","I'm not sure"]},
 {id:41,part:8,type:'single',q:"When learning a new software skill, what helps MOST?",o:["Watching the instructor demonstrate it","Watching a video","Reading step-by-step instructions","Trying it myself","Having someone work through it with me","A combination of several of these"]},
 {id:42,part:8,type:'single',q:"After a demonstration, what would you prefer to do next?",o:["Try the same thing immediately","Watch the demonstration again","Read written instructions","Ask questions before starting","Work through it with a classmate"]},
 {id:43,part:8,type:'single',q:"How comfortable are you asking the instructor for help?",o:["Very comfortable","Usually comfortable","It depends on the situation","Somewhat uncomfortable","Very uncomfortable"]},

function band(pct){if(pct==null)return null;if(pct>=0.8)return 'advanced';if(pct>=0.6)return 'ready';if(pct>=0.3)return 'developing';return 'emerging';}
function domainReadiness(ans){var out={},allC=0,allN=0;Object.keys(DOMAINS).forEach(function(d){var qs=DOMAINS[d],c=0,n=0;qs.forEach(function(qid){var a=ans[qid];if(a==null)return;n++;if(a===KEY[qid][0])c++;});allC+=c;allN+=n;out[d]=n?c/n:null;});out._overall=allN?allC/allN:null;return out;}
function expIndex(ans){var v=[1,4,30,31].map(function(id){return ans[id];}).filter(function(x){return x!=null;});if(!v.length)return null;return v.reduce(function(a,b){return a+b;},0)/v.length;}
function computeProfile(ans){
  var r=domainReadiness(ans),ex=expIndex(ans),overall=r._overall,q=function(id){return ans[id];};
  var interests=[];if(q(3)&&LABELS[3][q(3)]&&q(3)!==10)interests.push(LABELS[3][q(3)]);
  var support=(q(43)>=4)||(q(45)>=4)||(q(46)===1||q(46)===2||q(46)===4)||(q(39)===6)||(q(40)===6);
  var challenge=(ex!=null&&ex>=3.5)||(overall!=null&&overall>=0.75)||(q(47)===2);
  var mentor=(ex!=null&&ex>=3)&&(q(47)===3)&&(q(45)!=null&&q(45)<=2);
  return {readiness:{design:band(r.design),illustrator:band(r.illustrator),photoshop:band(r.photoshop),layout:band(r.layout),photography:band(r.photography)},
    readinessPct:r,overall:overall,experienceLevel:ex==null?null:(ex>=4?'experienced':(ex>=2.5?'some':'novice')),experienceIndex:ex,
    interest:interests[0]||null,startStyle:q(39)?LABELS[39][q(39)]:null,failureResponse:q(40)?LABELS[40][q(40)]:null,
    learningModality:q(41)?LABELS[41][q(41)]:null,groupingPref:q(44)?LABELS[44][q(44)]:null,
    mindset:q(46)===3?'growth':(q(46)?'developing':null),supportFlag:!!support,challengeReady:!!challenge,mentorCandidate:!!mentor};
}

async function openClass(c){
  CURCLASS=c; $('dashWrap').innerHTML='<div class="empty"><div><div class="spinner"></div>Loading '+esc(c.name||'class')+'…</div></div>';
  var usersMap={}, roster=[];
  try{
    var us=await db.collection('users').where('classId','==',c.id).get();
    us.forEach(d=>{var u=d.data();var nm=u.displayName||((u.firstName||'')+' '+(u.lastName||'')).trim()||u.email||d.id;usersMap[d.id]={name:nm,accountType:u.accountType};if(u.accountType!=='instructor'&&u.accountType!=='admin')roster.push(d.id);});
  }catch(e){}
  var completed=[];
  try{
    var as=await db.collection('assessments').where('classId','==',c.id).get();
    as.forEach(d=>{var a=d.data();if(a.status==='complete'&&a.answers)completed.push({uid:a.studentId||d.id,answers:a.answers});});
  }catch(e){ $('dashWrap').innerHTML='<div class="empty">Couldn\'t read assessments for this class (permission or connection).</div>'; return; }
  STUDENTS=completed.map(s=>({uid:s.uid,name:(usersMap[s.uid]&&usersMap[s.uid].name)||s.uid,answers:s.answers,profile:computeProfile(s.answers)}));
  STUDENTS.sort((a,b)=>a.name.localeCompare(b.name));
  CURCLASS._rosterCount = roster.length || STUDENTS.length;
  renderDash();
}

function renderDomains(){var html='';Object.keys(DOMAINS).forEach(function(d){var counts={emerging:0,developing:0,ready:0,advanced:0},nn=0,sum=0,sc=0;STUDENTS.forEach(s=>{var b=s.profile.readiness[d];if(b){counts[b]++;nn++;}var p=s.profile.readinessPct[d];if(p!=null){sum+=p;sc++;}});var avg=sc?Math.round(sum/sc*100):0;var seg=(k,col)=>{var w=nn?counts[k]/nn*100:0;return w?('<span style="width:'+w+'%;background:'+col+'" title="'+k+': '+counts[k]+'"></span>'):'';};html+='<div class="dom"><div><div class="dname">'+DOMAIN_LABEL[d]+'</div><div class="dsub">'+nn+' answered · avg '+avg+'%</div></div><div class="stack">'+seg('emerging','#e05c5c')+seg('developing','var(--gold)')+seg('ready','var(--blue)')+seg('advanced','var(--green)')+'</div></div>';});$('domains').innerHTML=html;}
function doughnut(id,labels,data){if(CHARTS[id])CHARTS[id].destroy();if(typeof Chart==='undefined')return;var pal=['#1a56c4','#da9e2b','#2d7a1a','#01123a','#6b21a8','#0e7490','#be185d','#b45309','#475569','#8a2c12'];CHARTS[id]=new Chart($(id),{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:labels.map((_,i)=>pal[i%pal.length]),borderColor:'#fff',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:10,family:'DM Sans'},boxWidth:12}}}}});}

function renderRoster(){var rows=STUDENTS.map(s=>{var p=s.profile,flags=[];if(p.supportFlag)flags.push('<span class="tagdot" title="May need support" style="color:var(--red)">●</span>');if(p.challengeReady)flags.push('<span class="tagdot" title="Challenge-ready" style="color:var(--blue)">●</span>');if(p.mentorCandidate)flags.push('<span class="tagdot" title="Mentor" style="color:var(--green)">●</span>');return {name:s.name,overall:p.overall==null?-1:p.overall,exp:p.experienceLevel||'—',interest:p.interest||'—',learn:p.learningModality||'—',flags:flags.join('')||'—',expOrder:{novice:0,some:1,experienced:2}[p.experienceLevel]??-1};});var k=rosterSort.key,dir=rosterSort.dir;rows.sort((a,b)=>{var x=a[k==='exp'?'expOrder':k],y=b[k==='exp'?'expOrder':k];if(typeof x==='string')return dir*x.localeCompare(y);return dir*((x||0)-(y||0));});$('rosterBody').innerHTML=rows.map(r=>'<tr><td><b>'+esc(r.name)+'</b></td><td>'+(r.overall<0?'—':Math.round(r.overall*100)+'%')+'</td><td style="text-transform:capitalize">'+esc(r.exp)+'</td><td>'+esc(r.interest)+'</td><td>'+esc(r.learn)+'</td><td>'+r.flags+'</td></tr>').join('');document.querySelectorAll('#rosterTbl th').forEach(th=>th.onclick=()=>{var kk=th.dataset.sort;rosterSort.dir=(rosterSort.key===kk)?-rosterSort.dir:1;rosterSort.key=kk;renderRoster();});}
function renderDrill(){var html='';for(var part=1;part<=9;part++){var qs=Q.filter(q=>q.part===part),inner='';qs.forEach(function(q){var isMulti=q.type==='multi',res=isMulti?tallyMulti(q.id):tallySingle(q.id),denom=res.n||STUDENTS.length,key=KEY[q.id];inner+='<div class="qitem"><div class="qq"><span class="qn">Q'+q.id+'</span>'+esc(q.q)+'</div>';q.o.forEach(function(opt,i){var idx=i+1,cnt=res.t[idx]||0,pc=pct(cnt,denom),cls='';if(key&&key[0]===idx)cls=' correct';else if(key&&key[1]===idx)cls=' unsure';inner+='<div class="obar'+cls+'"><div class="otext">'+(key&&key[0]===idx?'<span class="ck">✓ </span>':'')+esc(opt)+'</div><div class="ov">'+cnt+' · '+pc+'%</div></div><div class="obar'+cls+'" style="grid-template-columns:1fr"><div class="otrack"><div class="ofill" style="width:'+pc+'%"></div></div></div>';});inner+='</div>';});html+='<details class="qd"><summary>Part '+part+' — '+esc(PARTS[part-1].t)+'<span class="cn">'+qs.length+' questions</span></summary><div class="qblock">'+inner+'</div></details>';}$('qdrill').innerHTML=html;}
function renderInsights(){var N=STUDENTS.length,out=[];var domAvg={};Object.keys(DOMAINS).forEach(d=>{var sum=0,c=0;STUDENTS.forEach(s=>{var p=s.profile.readinessPct[d];if(p!=null){sum+=p;c++;}});domAvg[d]=c?sum/c:null;});var weakest=Object.keys(domAvg).filter(d=>domAvg[d]!=null).sort((a,b)=>domAvg[a]-domAvg[b]);if(weakest.length){var d=weakest[0];out.push(['◱','<b>Start '+DOMAIN_LABEL[d].toLowerCase()+' from the ground up.</b> Lowest readiness area (avg '+Math.round(domAvg[d]*100)+'% correct). Assume little prior knowledge.']);}var strongest=weakest[weakest.length-1];if(strongest&&domAvg[strongest]>=0.6){out.push(['◲','<b>'+DOMAIN_LABEL[strongest]+' is a relative strength</b> (avg '+Math.round(domAvg[strongest]*100)+'%). Move faster or use it for early confidence.']);}var exp={novice:0,some:0,experienced:0};STUDENTS.forEach(s=>{if(s.profile.experienceLevel)exp[s.profile.experienceLevel]++;});if(exp.experienced>=1){out.push(['★','<b>'+exp.experienced+' student'+(exp.experienced>1?'s have':' has')+' real prior experience.</b> Prepare stretch briefs or peer-mentor roles.']);}if(exp.novice/N>=0.5){out.push(['○','<b>Largely a beginner class</b> ('+exp.novice+'/'+N+' novices). Demos + immediate practice, celebrate early wins.']);}var lm={};STUDENTS.forEach(s=>{if(s.profile.learningModality)lm[s.profile.learningModality]=(lm[s.profile.learningModality]||0)+1;});var topLm=Object.keys(lm).sort((a,b)=>lm[b]-lm[a])[0];if(topLm){out.push(['▷','<b>They learn best by "'+topLm.toLowerCase()+'".</b> Pair each concept with that mode.']);}var support=STUDENTS.filter(s=>s.profile.supportFlag).length;if(support){out.push(['♥','<b>'+support+' may need extra support.</b> Build in private check-ins and low-stakes, structured critique early.']);}var uncomfHelp=STUDENTS.filter(s=>s.answers[43]>=4).length;if(uncomfHelp/N>=0.3){out.push(['?','<b>Many are hesitant to ask for help</b> ('+uncomfHelp+'/'+N+'). Normalize questions with routines like a "stuck board".']);}var growth=STUDENTS.filter(s=>s.profile.mindset==='growth').length;if(N&&growth/N<0.5){out.push(['↻','<b>Feedback mindset is still forming</b> ('+growth+'/'+N+' clearly see critique as improvement). Frame feedback as "next steps".']);}var it={};STUDENTS.forEach(s=>{if(s.profile.interest)it[s.profile.interest]=(it[s.profile.interest]||0)+1;});var topI=Object.keys(it).sort((a,b)=>it[b]-it[a]).slice(0,2);if(topI.length){out.push(['♡','<b>Strongest interests: '+topI.join(' and ')+'.</b> Anchor an early project here to hook motivation.']);}var proHi=STUDENTS.filter(s=>s.answers[49]===1||s.answers[49]===2).length;if(proHi/N>=0.4){out.push(['↗','<b>'+proHi+'/'+N+' already eye this as a career.</b> "This is how pros work" framing + portfolio building will land.']);}var ch=STUDENTS.filter(s=>s.profile.challengeReady).length,me=STUDENTS.filter(s=>s.profile.mentorCandidate).length;if(ch){out.push(['▲','<b>'+ch+' ready for a challenge.</b> Keep extension tasks ready.']);}if(me){out.push(['⚑','<b>'+me+' potential peer mentor'+(me>1?'s':'')+'.</b> Lean on them for peer help and demos.']);}$('insBody').innerHTML=out.map(o=>'<div class="ins"><div class="ic">'+o[0]+'</div><div class="tx">'+o[1]+'</div></div>').join('');}
function wireExports(){var cb=$('csvBtn');if(cb)cb.onclick=exportCSV;var pb=$('printBtn');if(pb)pb.onclick=()=>window.print();}
function exportCSV(){var head=['Name','KnowledgeOverall%','Experience','Interest','LearningStyle','StartStyle','WhenStuck','GroupPref','Mindset','Support','ChallengeReady','Mentor','Design','Illustrator','Photoshop','Layout','Photography'];var rows=STUDENTS.map(s=>{var p=s.profile;return [s.name,p.overall==null?'':Math.round(p.overall*100),p.experienceLevel||'',p.interest||'',p.learningModality||'',p.startStyle||'',p.failureResponse||'',p.groupingPref||'',p.mindset||'',p.supportFlag?'yes':'',p.challengeReady?'yes':'',p.mentorCandidate?'yes':'',p.readiness.design||'',p.readiness.illustrator||'',p.readiness.photoshop||'',p.readiness.layout||'',p.readiness.photography||''];});var csv=[head].concat(rows).map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');var blob=new Blob([csv],{type:'text/csv'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='CPLA_'+((CURCLASS.name||'class').replace(/[^a-z0-9]+/gi,'_'))+'_insights.csv';a.click();}
</script>
