<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPLA — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:   #01123a;
      --gold:   #da9e2b;
      --gold-l: rgba(218,158,43,.1);
      --paper:  #faf7f2;
      --rule:   #d4c9b8;
      --mid:    #6b5e52;
      --ink:    #1a1410;
      --red:    #c8401a;
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      background: var(--blue);
      color: var(--ink);
    }

    /* Subtle gold glow — matches landing page */
    body::before {
      content: "";
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse at 50% 40%, rgba(218,158,43,.07) 0%, transparent 62%);
      pointer-events: none;
    }

    /* ── PAGE LAYOUT ── */
    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* ── LOGO ── */
    .brand {
      margin-bottom: 28px;
      text-align: center;
    }
    .brand img {
      width: clamp(260px, 38vw, 380px);
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* ── CARD ── */
    .card {
      background: var(--paper);
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,.35);
    }
    .card-body { padding: 32px 28px; }

    /* ── FORM ── */
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 5px;
      font-weight: 500;
    }
    .field input {
      width: 100%;
      padding: 10px 13px;
      border: 1px solid var(--rule);
      border-radius: 8px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      background: white;
      color: var(--ink);
      transition: border-color 0.15s;
      outline: none;
    }
    .field input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(218,158,43,.12); }
    .field input::placeholder { color: #b0a090; }

    .sign-in-btn {
      width: 100%;
      padding: 12px;
      background: var(--blue);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
      transition: opacity 0.15s;
    }
    .sign-in-btn:hover { opacity: 0.85; }
    .sign-in-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── DIVIDER ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
      font-size: 11px;
      color: var(--mid);
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--rule);
    }

    /* ── GUEST BUTTON ── */
    .guest-btn {
      width: 100%;
      padding: 11px;
      background: transparent;
      color: var(--gold);
      border: 1.5px solid var(--gold);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
    }
    .guest-btn:hover { background: var(--gold-l); }
    .guest-btn:disabled { opacity: .4; cursor: not-allowed; }
    .guest-desc {
      text-align: center;
      font-size: 11px;
      color: var(--mid);
      margin-top: 8px;
      line-height: 1.5;
    }

    /* ── ERROR ── */
    .error-msg {
      background: #fdf0ed;
      border: 1px solid #f0c4b8;
      border-radius: 6px;
      padding: 9px 12px;
      font-size: 12px;
      color: var(--red);
      margin-top: 12px;
      display: none;
      align-items: center;
      gap: 7px;
    }
    .error-msg.visible { display: flex; }

    /* ── SPINNER ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .spinner-gold {
      border-color: rgba(218,158,43,.25);
      border-top-color: var(--gold);
    }

    /* ── BACK LINK ── */
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; color: rgba(255,255,255,.3);
      text-decoration: none; letter-spacing: .06em;
      font-family: 'DM Mono', monospace; text-transform: uppercase;
      margin-bottom: 20px;
      transition: color .15s;
    }
    .back-link:hover { color: rgba(255,255,255,.65); }

    /* ── FOOTER ── */
    .footer {
      text-align: center;
      font-size: 10px;
      color: rgba(255,255,255,.15);
      margin-top: 24px;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div class="page">

    <a href="index.html" class="back-link">
      <i class="ti ti-arrow-left"></i> Back
    </a>

    <div class="brand">
      <img src="CPLA-logo-full-rev.svg" alt="Creative Professional Learning Academy">
    </div>

    <div class="card">
      <div class="card-body">

        <form id="login-form" autocomplete="on" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@studio.com" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
          </div>
          <button type="submit" class="sign-in-btn" id="sign-in-btn">
            <i class="ti ti-arrow-right"></i> Sign in
          </button>
        </form>

        <div class="error-msg" id="error-msg">
          <i class="ti ti-alert-circle"></i>
          <span id="error-text">Invalid email or password.</span>
        </div>

        <div class="divider">or</div>

        <button class="guest-btn" id="guest-btn">
          <i class="ti ti-eye"></i> Review as Guest
        </button>
        <div class="guest-desc">Pre-loaded reviewer session — no account needed</div>

      </div>
    </div>

    <div class="footer">
      CPLA Platform · Private Beta · Volume 2
    </div>

    <a href="register.html" style="
      display:inline-flex; align-items:center; gap:6px;
      margin-top:14px;
      font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500;
      color:rgba(255,255,255,.55); text-decoration:none;
      background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
      padding:9px 20px; border-radius:100px;
      transition:background .15s, color .15s;
    " onmouseover="this.style.background='rgba(218,158,43,.12)';this.style.color='rgba(218,158,43,.9)'"
       onmouseout="this.style.background='rgba(255,255,255,.06)';this.style.color='rgba(255,255,255,.55)'">
      <i class="ti ti-user-plus" style="font-size:15px"></i> New User? Create an account
    </a>
  </div>

  <!-- Firebase SDK (compat v9) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    const form    = document.getElementById('login-form');
    const emailIn = document.getElementById('email');
    const passIn  = document.getElementById('password');
    const signBtn = document.getElementById('sign-in-btn');
    const errBox  = document.getElementById('error-msg');
    const errTxt  = document.getElementById('error-text');
    const guestBtn = document.getElementById('guest-btn');

    // If already signed in, go straight to dashboard
    auth.onAuthStateChanged(function(user) {
      if (user) window.location.href = 'dashboard.html';
    });

    function showError(msg) {
      errTxt.textContent = msg;
      errBox.classList.add('visible');
    }
    function clearError() {
      errBox.classList.remove('visible');
    }

    function setLoading(btn, loading) {
      if (loading) {
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div>';
      } else {
        btn.disabled = false;
      }
    }

    // Email / password sign-in
    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      clearError();
      const email = emailIn.value.trim();
      const pass  = passIn.value;
      if (!email || !pass) { showError('Please enter your email and password.'); return; }
      setLoading(signBtn, true);
      try {
        await auth.signInWithEmailAndPassword(email, pass);
        window.location.href = 'dashboard.html';
      } catch (err) {
        setLoading(signBtn, false);
        signBtn.innerHTML = '<i class="ti ti-arrow-right"></i> Sign in';
        if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
          showError('Invalid email or password.');
        } else if (err.code === 'auth/too-many-requests') {
          showError('Too many attempts. Please wait a moment and try again.');
        } else {
          showError('Something went wrong. Please try again.');
        }
      }
    });

    // Guest / reviewer sign-in
    guestBtn.addEventListener('click', async function() {
      clearError();
      guestBtn.disabled = true;
      guestBtn.innerHTML = '<div class="spinner spinner-gold"></div>';
      try {
        await auth.signInWithEmailAndPassword(GUEST_EMAIL, GUEST_PASSWORD);
        window.location.href = 'dashboard.html';
      } catch (err) {
        guestBtn.disabled = false;
        guestBtn.innerHTML = '<i class="ti ti-eye"></i> Review as Guest';
        showError('Guest account not yet set up. Run seed-guest.html first.');
      }
    });
  </script>
</body>
</html>
