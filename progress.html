<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPLA — Progress</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" rel="stylesheet">
<style>
  :root{
    --navy:#01123a; --navy2:#0a1c44; --gold:#da9e2b; --gold-tint:#fbf3e0;
    --blue:#1a56c4; --blue-tint:#e8f0fe; --ink:#1a1410; --paper:#faf7f2;
    --cream:#f0ead8; --rule:#d4c9b8; --mid:#6b5e52;
    --green:#2d7a1a; --green-tint:#f0fae8; --red:#dc2626; --red-tint:#fdeaea;
    --serif:'Playfair Display',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif; --mono:'DM Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--cream);font-family:var(--sans);color:var(--ink);padding:22px 16px}
  .wrap{max-width:1080px;margin:0 auto}
  .num{font-family:var(--serif)}
  a{color:var(--blue)}
  #loading{max-width:1080px;margin:60px auto;text-align:center;color:var(--mid);font-size:14px}
  #app{display:none}

  .topbar{background:var(--navy);border-radius:16px 16px 0 0;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .back{color:rgba(255,255,255,.75);text-decoration:none;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
  .back:hover{color:#fff}
  .tb-title{color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;gap:9px}
  .tb-title .k{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
  .tb-right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .demo-tag{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);background:var(--gold);padding:3px 9px;border-radius:100px;font-weight:600}

  .sheet{background:#fff;border:1px solid var(--rule);border-top:0;border-radius:0 0 16px 16px;padding:0 0 24px;box-shadow:0 10px 40px rgba(1,18,58,.10)}
  .shead{display:flex;align-items:center;gap:16px;padding:20px 26px;border-bottom:1px solid #efeae0;flex-wrap:wrap}
  .s-av{width:56px;height:56px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700;flex-shrink:0}
  .s-id .nm{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--navy);line-height:1.1}
  .s-id .meta{font-size:12px;color:var(--mid);margin-top:3px}
  .s-status{margin-left:auto;display:flex;align-items:center;gap:10px}
  .chip{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 11px;border-radius:100px}
  .c-ontrack{background:var(--green-tint);color:var(--green)}
  .c-behind{background:var(--gold-tint);color:#a8760f}
  .c-risk{background:var(--red-tint);color:var(--red)}
  .toggle{display:inline-flex;background:var(--cream);border-radius:100px;padding:3px}
  .toggle button{border:0;background:transparent;font-family:inherit;font-size:12px;font-weight:600;color:var(--mid);padding:7px 15px;border-radius:100px;cursor:pointer}
  .toggle button.on{background:var(--navy);color:#fff}
  .toggle button.on.stu{background:var(--gold);color:var(--navy)}

  .body{padding:22px 26px}
  .viewnote{font-size:11.5px;color:var(--mid);margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .viewnote .dot{width:8px;height:8px;border-radius:50%;background:var(--navy)}
  .viewnote.stu .dot{background:var(--gold)}

  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px}
  @media(max-width:820px){.kpis{grid-template-columns:repeat(3,1fr)}}
  .kpi{background:#fff;border:1px solid var(--rule);border-top:3px solid var(--blue);border-radius:12px;padding:13px 14px}
  .kpi .v{font-size:23px;font-weight:900;line-height:1.1}
  .kpi .l{font-size:10px;color:var(--mid);margin-top:3px}

  .cols{display:grid;grid-template-columns:1fr 1.15fr;gap:18px}
  @media(max-width:820px){.cols{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--rule);border-radius:13px;padding:16px 18px;margin-bottom:16px}
  .card h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}

  table{width:100%;border-collapse:collapse}
  th{padding:7px 8px;text-align:left;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);font-weight:600;border-bottom:2px solid var(--rule);white-space:nowrap}
  td{padding:9px 8px;border-bottom:1px solid #efeae0;font-size:12.5px;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .lz{font-weight:600;color:var(--navy)}
  .st{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:100px;white-space:nowrap}
  .st.not_started{background:#eee;color:#888}
  .st.learning,.st.practicing,.st.creating{background:var(--blue-tint);color:var(--blue)}
  .st.reviewing,.st.awaiting_feedback{background:var(--gold-tint);color:#a8760f}
  .st.certified{background:var(--green-tint);color:var(--green)}
  .bar{height:6px;background:var(--cream);border-radius:100px;overflow:hidden;min-width:60px}
  .bar>i{display:block;height:100%;border-radius:100px;background:var(--blue)}
  .scoredot{font-weight:700}
  .kv{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:8px 0;border-bottom:1px dashed var(--rule)}
  .kv:last-child{border-bottom:0}
  .kv .lab{color:var(--mid)}
  .kv .val{font-weight:600}
  .flag{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border-radius:9px;margin-bottom:8px;font-size:12.5px;line-height:1.45}
  .flag.warn{background:var(--gold-tint)} .flag.good{background:var(--green-tint)} .flag.risk{background:var(--red-tint)}
  .flag .t{font-size:9px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:100px;background:#fff;flex-shrink:0}
  .flag.warn .t{color:#a8760f} .flag.good .t{color:var(--green)} .flag.risk .t{color:var(--red)}

  .stu-hero{background:linear-gradient(150deg,var(--navy),var(--navy2));border-radius:14px;padding:22px 24px;color:#fff;display:flex;align-items:center;gap:24px;margin-bottom:18px;flex-wrap:wrap}
  .stu-hero .msg{flex:1;min-width:220px}
  .stu-hero .msg .hl{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.2;margin-bottom:6px}
  .stu-hero .msg .hl em{color:var(--gold);font-style:italic}
  .stu-hero .msg p{font-size:13px;color:rgba(255,255,255,.72);line-height:1.55}
  .ring-cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-top:6px;font-family:var(--mono);text-align:center}
  .stu-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:820px){.stu-grid{grid-template-columns:1fr}}
  .win{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--green-tint);border-radius:10px;margin-bottom:8px;font-size:13px}
  .win .ic{width:26px;height:26px;border-radius:7px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700;flex-shrink:0}
  .nudge{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--gold-tint);border-radius:10px;margin-bottom:8px;font-size:13px}
  .nudge .ic{width:26px;height:26px;border-radius:7px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:700;flex-shrink:0}
  .nudge a{margin-left:auto;font-size:12px;font-weight:600;color:var(--navy);background:#fff;border:1px solid var(--rule);border-radius:8px;padding:6px 11px;text-decoration:none;white-space:nowrap}
  .next-up{background:var(--blue-tint);border:1px solid #cddcf7;border-radius:12px;padding:14px 16px;margin-bottom:18px}
  .next-up .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);font-family:var(--mono);margin-bottom:5px}
  .next-up .l{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--navy)}
  .next-up p{font-size:12.5px;color:var(--mid);margin-top:4px;line-height:1.5}

  .empty{text-align:center;padding:46px 24px;color:var(--mid)}
  .empty .ic{font-size:40px;color:var(--rule);margin-bottom:12px}
  .empty h4{font-family:var(--serif);font-size:19px;color:var(--navy);margin-bottom:8px}
  .empty p{font-size:13px;line-height:1.6;max-width:460px;margin:0 auto}
  .empty code{background:var(--cream);padding:1px 6px;border-radius:5px;font-family:var(--mono);font-size:12px}
</style>
</head>
<body>
<div id="loading">Loading progress…</div>

<div class="wrap" id="app">
  <div class="topbar">
    <a class="back" id="back" href="workspace.html"><i class="ti ti-arrow-left"></i> <span id="back-label">Back</span></a>
    <div class="tb-title"><span class="k">CPLA</span> · Progress</div>
    <div class="tb-right" id="tb-right"></div>
  </div>
  <div class="sheet">
    <div class="shead">
      <div class="s-av" id="s-av"></div>
      <div class="s-id"><div class="nm" id="s-nm"></div><div class="meta" id="s-meta"></div></div>
      <div class="s-status">
        <span id="s-chip"></span>
        <div class="toggle" id="toggle" style="display:none">
          <button id="tg-ins" class="on" onclick="setView('instructor')">Instructor view</button>
          <button id="tg-stu" class="stu" onclick="setView('student')">Student view</button>
        </div>
      </div>
    </div>
    <div class="body" id="body"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  var Q=new URLSearchParams(location.search);
  var DEMO=Q.get('demo')==='1';
  var PAL=['#1a56c4','#0891b2','#2d7a1a','#b45309','#6b21a8','#0e7490','#475569','#334e8f'];
  var STATUS_LABEL={not_started:'Not started',learning:'Learning',practicing:'Practicing',creating:'Creating',reviewing:'Reviewing',awaiting_feedback:'Awaiting feedback',certified:'Certified'};
  var STATUS_KEYS=['not_started','learning','practicing','creating','reviewing','awaiting_feedback','certified'];
  var LESSONS=[
    {id:'1.1',t:'Design Is Everywhere'},{id:'1.2',t:'The Three Questions'},{id:'1.3',t:'Elements of Design'},
    {id:'1.4',t:'Line & Shape'},{id:'2.1',t:'Color Foundations'},{id:'2.2',t:'Color in Practice'},
    {id:'2.3',t:'Type Basics'},{id:'2.4',t:'Hierarchy'},{id:'3.1',t:'Balance & Contrast'},{id:'3.2',t:'Composition'}
  ];
  function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function initialsOf(n){return (n||'?').split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,2);}
  function colorOf(id){var h=0; (id||'').split('').forEach(function(c){h=(h*31+c.charCodeAt(0))>>>0;}); return PAL[h%PAL.length];}
  function fmtTime(m){var h=Math.floor(m/60);return h?(h+'h '+(m%60)+'m'):(m+'m');}
  function scoreColor(s){return s>=90?'#2d7a1a':s>=80?'#1a56c4':s>=70?'#a8760f':s>=60?'#c8781a':'#dc2626';}

  var STATE={view:'student', isInstructor:false, prog:null, meta:null};

  firebase.auth?0:0;
  auth.onAuthStateChanged(async function(user){
    if(!user){location.href='login';return;}
    var me={}; try{me=(await db.collection('users').doc(user.uid).get()).data()||{};}catch(e){}
    var isInstructor = me.accountType==='instructor';
    var view, targetUid, backHref, backLabel;
    if(isInstructor){
      view=(Q.get('view')==='student')?'student':'instructor';
      targetUid=Q.get('student')||user.uid;
      backHref='studio-director.html'; backLabel='Studio Director';
    } else {
      view='student'; targetUid=user.uid; backHref='workspace.html'; backLabel='Workspace';
    }
    var t={}; if(targetUid===user.uid){ t=me; } else { try{ t=(await db.collection('users').doc(targetUid).get()).data()||{}; }catch(e){} }
    var name=((t.firstName||'')+' '+(t.lastName||'')).trim()|| t.displayName || (t.email?t.email.split('@')[0]:'Student');
    var prog = DEMO ? demoProgress(name) : await realProgress(targetUid);

    document.getElementById('back').href=backHref;
    document.getElementById('back-label').textContent=backLabel;
    document.getElementById('tb-right').innerHTML = DEMO?'<span class="demo-tag">Preview data</span>':'';
    STATE={view:view, isInstructor:isInstructor, prog:prog, meta:{name:name, initials:initialsOf(name), color:colorOf(targetUid), level:t.role||'Student', current:prog.current||'—'}};
    render();
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='block';
  });

  async function realProgress(uid){
    var out={hasData:false, current:'—', pace:'ontrack', lessons:[], assessments:[]};
    try{
      var subs=await db.collection('submissions').where('studentId','==',uid).get();
      var prog=await db.collection('lesson_progress').where('studentId','==',uid).get();
      if(subs.size||prog.size){ out.hasData=true; /* Phase 1 wires the full mapping here */ }
    }catch(e){}
    return out;
  }

  function setView(v){ if(!STATE.isInstructor) return; STATE.view=v; render(); }

  function render(){
    var m=STATE.meta, p=STATE.prog;
    document.getElementById('s-av').style.background=m.color;
    document.getElementById('s-av').textContent=m.initials;
    document.getElementById('s-nm').textContent=m.name;
    document.getElementById('s-meta').textContent=m.level+' · '+(p.hasData?('Currently on Lesson '+m.current+' · '):'')+'Volume 1';
    var chip='';
    if(p.hasData){ chip=p.pace==='ontrack'?'<span class="chip c-ontrack">On track</span>':p.pace==='behind'?'<span class="chip c-behind">Behind pace</span>':'<span class="chip c-risk">Needs attention</span>'; }
    document.getElementById('s-chip').innerHTML=chip;
    var tg=document.getElementById('toggle');
    tg.style.display=(STATE.isInstructor && p.hasData)?'inline-flex':'none';
    document.getElementById('tg-ins').className=STATE.view==='instructor'?'on':'';
    document.getElementById('tg-stu').className='stu'+(STATE.view==='student'?' on':'');
    var body=document.getElementById('body');
    if(!p.hasData){ body.innerHTML=emptyState(STATE.view, m.name, STATE.isInstructor); return; }
    body.innerHTML=STATE.view==='instructor'?instructorView(p,m):studentView(p,m);
  }

  function emptyState(view, name, isInstructor){
    if(isInstructor){
      return '<div class="empty"><div class="ic"><i class="ti ti-chart-dots"></i></div>'+
        '<h4>Progress tracking isn’t active yet</h4>'+
        '<p>Once activities are recorded for '+esc(name)+' (assessment scores, time on task, completion), this page fills with the full breakdown — both this instructor view and the student’s encouraging view. Preview the populated layout by adding <code>?demo=1</code> to the URL.</p></div>';
    }
    return '<div class="empty"><div class="ic"><i class="ti ti-seeding"></i></div>'+
      '<h4>Your progress will grow here</h4>'+
      '<p>As you complete lessons and activities, you’ll see your momentum, wins, and what’s next — all in one place. You’re just getting started. Open Volume 1 and dive in!</p></div>';
  }

  /* ---------- SVG ---------- */
  function ring(pct,size,color){
    var r=(size/2)-7,c=2*Math.PI*r,off=c*(1-pct/100),cx=size/2;
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
      '<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="10"/>'+
      '<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 '+cx+' '+cx+')"/>'+
      '<text x="'+cx+'" y="'+(cx-2)+'" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-family="Playfair Display,serif" font-size="'+(size*0.26)+'" font-weight="900">'+pct+'%</text>'+
      '<text x="'+cx+'" y="'+(cx+size*0.17)+'" text-anchor="middle" fill="rgba(255,255,255,.55)" font-size="'+(size*0.085)+'" font-family="DM Mono,monospace">DONE</text></svg>';
  }
  function sparkline(vals,w,h){
    if(!vals.length) return '';
    var min=Math.min.apply(null,vals),max=Math.max.apply(null,vals),rg=(max-min)||1;
    var pts=vals.map(function(v,i){var x=6+(i/(vals.length-1))*(w-12);var y=h-6-((v-min)/rg)*(h-16);return x+','+y;});
    var last=vals[vals.length-1],first=vals[0],col=last>=first?'#2d7a1a':'#da9e2b';
    var dots=vals.map(function(v,i){var p=pts[i].split(',');return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.6" fill="'+col+'"/>';}).join('');
    return '<svg width="'+w+'" height="'+h+'"><polyline points="'+pts.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linejoin="round"/>'+dots+'</svg>';
  }

  /* ---------- INSTRUCTOR VIEW ---------- */
  function instructorView(s,m){
    var scores=s.assessments.map(function(a){return a[0];});
    var kpis=[
      ['Grade avg',s.gradeAvg+'%',scoreColor(s.gradeAvg)],['Completion',s.completion+'%','#1a56c4'],
      ['Time on task',fmtTime(s.timeMins),'#01123a'],['Missing',s.missing,s.missing?'#dc2626':'#2d7a1a'],
      ['Active days',s.activeDays,'#01123a'],['Last active',s.lastActive,s.lastActive.indexOf('day')>-1?'#a8760f':'#2d7a1a']
    ];
    var kpiHtml=kpis.map(function(k){return '<div class="kpi" style="border-top-color:'+k[2]+'"><div class="v num" style="color:'+k[2]+'">'+k[1]+'</div><div class="l">'+k[0]+'</div></div>';}).join('');
    var flags=s.flags.map(function(f){return '<div class="flag '+f[0]+'"><span class="t">'+f[1]+'</span><div>'+f[2]+'</div></div>';}).join('');
    var rows=s.lessons.map(function(L){
      var sc=L.score==null?'<span style="color:#bbb">—</span>':'<span class="scoredot" style="color:'+scoreColor(L.score)+'">'+L.score+'</span>';
      var sub=L.submitted?'<span style="color:#2d7a1a">✓</span>':(L.status==='not_started'?'<span style="color:#bbb">—</span>':'<span style="color:#dc2626">•</span>');
      return '<tr><td class="lz">'+L.id+'</td><td>'+esc(L.title)+'</td><td><span class="st '+L.status+'">'+STATUS_LABEL[L.status]+'</span></td>'+
        '<td><div style="display:flex;align-items:center;gap:7px"><div class="bar"><i style="width:'+L.completion+'%"></i></div><span style="font-size:11px;color:#6b5e52">'+L.completion+'%</span></div></td>'+
        '<td style="white-space:nowrap;color:#6b5e52">'+(L.time?fmtTime(L.time):'—')+'</td><td>'+sc+'</td><td style="text-align:center">'+sub+'</td></tr>';
    }).join('');
    var assessList=s.assessments.slice().reverse().map(function(a){return '<div class="kv"><span class="lab">'+a[1]+'</span><span class="val" style="color:'+scoreColor(a[0])+'">'+a[0]+'</span></div>';}).join('');
    return '<div class="viewnote"><span class="dot"></span> Instructor view — full analytics. The student sees the same data reframed encouragingly (toggle above).</div>'+
      '<div class="kpis">'+kpiHtml+'</div>'+
      (flags?'<div class="card" style="border-left:4px solid '+(s.pace==='risk'?'#dc2626':s.pace==='behind'?'#da9e2b':'#2d7a1a')+'"><h3>Signals</h3>'+flags+'</div>':'')+
      '<div class="cols"><div>'+
        '<div class="card"><h3>Assessment scores <span>trend</span></h3><div style="margin-bottom:10px">'+sparkline(scores,260,54)+'</div>'+assessList+'</div>'+
        '<div class="card"><h3>Engagement &amp; time</h3>'+
          '<div class="kv"><span class="lab">Total time on task</span><span class="val">'+fmtTime(s.timeMins)+'</span></div>'+
          '<div class="kv"><span class="lab">Avg / active day</span><span class="val">'+fmtTime(Math.round(s.timeMins/Math.max(1,s.activeDays)))+'</span></div>'+
          '<div class="kv"><span class="lab">Active days</span><span class="val">'+s.activeDays+'</span></div>'+
          '<div class="kv"><span class="lab">Current streak</span><span class="val">'+s.streak+' days</span></div>'+
          '<div class="kv"><span class="lab">Last active</span><span class="val">'+s.lastActive+'</span></div></div>'+
        '<div class="card"><h3>Focus areas</h3>'+s.focus.map(function(x){return '<div class="kv"><span class="lab" style="color:#a8760f">→ '+esc(x)+'</span></div>';}).join('')+'</div>'+
      '</div><div>'+
        '<div class="card"><h3>Per-lesson activity <span>'+s.completion+'% overall</span></h3><div style="overflow-x:auto"><table>'+
          '<thead><tr><th>#</th><th>Lesson</th><th>Status</th><th>Completion</th><th>Time</th><th>Score</th><th>Sub</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
      '</div></div>';
  }

  /* ---------- STUDENT VIEW ---------- */
  function studentView(s,m){
    var done=s.lessons.filter(function(L){return L.status==='certified'||L.status==='reviewing'||L.status==='awaiting_feedback';}).length;
    var first=m.name.split(' ')[0], head, sub;
    if(s.pace==='ontrack'){ head='You’re doing <em>great</em>, '+esc(first)+'.'; sub='Strong momentum and steady scores. Keep the streak going — you’re right where you want to be.'; }
    else if(s.pace==='behind'){ head='Nice work — let’s <em>close the gap</em>.'; sub='Your quality is strong; you’re just a couple of activities behind. A short catch-up gets you fully back on track.'; }
    else { head='Let’s get some <em>momentum</em> back.'; sub='Every designer hits a slow stretch. Pick one small thing below and start there — your instructor is in your corner.'; }
    var wins=s.strengths.map(function(x){return '<div class="win"><span class="ic">★</span><div>'+esc(x)+'</div></div>';}).join('');
    if(s.streak>0) wins='<div class="win"><span class="ic"><i class="ti ti-flame"></i></span><div>'+s.streak+'-day streak — keep it alive!</div></div>'+wins;
    var best=Math.max.apply(null,s.assessments.map(function(a){return a[0];}));
    wins+='<div class="win"><span class="ic">↑</span><div>Your best assessment: '+best+' — real progress.</div></div>';
    var missing=s.lessons.filter(function(L){return !L.submitted && L.status!=='not_started' && L.status!=='certified';});
    var nudges=missing.slice(0,3).map(function(L){return '<div class="nudge"><span class="ic">▸</span><div>Finish <b>Lesson '+L.id+'</b> — '+esc(L.title)+'</div><a href="volume1.html">Open</a></div>';}).join('');
    if(!nudges) nudges='<div class="win"><span class="ic">✓</span><div>Nothing outstanding — you’re all caught up!</div></div>';
    return '<div class="viewnote stu"><span class="dot"></span> Your progress — the same information your instructor sees, framed to keep you moving.</div>'+
      '<div class="stu-hero"><div><div style="display:flex;justify-content:center">'+ring(s.completion,132,'#da9e2b')+'</div><div class="ring-cap">Volume 1</div></div>'+
        '<div class="msg"><div class="hl">'+head+'</div><p>'+sub+'</p></div></div>'+
      '<div class="next-up"><div class="k">Next up</div><div class="l">Lesson '+esc(m.current)+'</div><p>You’ve completed '+done+' of '+s.lessons.length+' lessons and logged '+fmtTime(s.timeMins)+' of focused studio time. Keep going — one activity at a time.</p></div>'+
      '<div class="stu-grid"><div class="card"><h3 style="color:#2d7a1a">Your wins</h3>'+wins+'</div>'+
        '<div class="card"><h3 style="color:#a8760f">Quick catch-ups</h3>'+nudges+'<p style="font-size:11.5px;color:#6b5e52;margin-top:6px;line-height:1.5">Small steps, not a scoreboard — gentle nudges, and your instructor sees your full picture too.</p></div></div>';
  }

  /* ---------- DEMO PROFILE (for ?demo=1 preview) ---------- */
  function demoProgress(name){
    function mk(spec){return LESSONS.map(function(L,i){var s=spec[i]||[0,0,0,null,false];return {id:L.id,title:L.t,status:STATUS_KEYS[s[0]],completion:s[1],time:s[2],score:s[3],submitted:s[4]};});}
    return { hasData:true, current:'2.4 Hierarchy', pace:'behind', gradeAvg:83, completion:66, timeMins:910, missing:1, activeDays:20, lastActive:'today', streak:6,
      lessons:mk([[6,100,110,85,true],[6,100,95,82,true],[6,100,100,80,true],[5,100,90,84,true],[5,100,120,88,true],[4,85,80,82,true],[3,60,60,null,false],[2,30,35,null,false],[0,0,0,null,false],[0,0,0,null,false]]),
      assessments:[[74,'Apr 22'],[78,'May 3'],[80,'May 17'],[82,'May 24'],[85,'Jun 1']],
      strengths:['Color mastery','Expressive composition','Strong design voice'],
      focus:['Readability','Following brief constraints','Pace (2 lessons behind)'],
      flags:[['warn','WATCH','Pacing 2 lessons behind the class pointer — strong work, just needs to catch up.']] };
  }
</script>
