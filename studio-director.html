<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPLA — Studio Director</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ink:#1a1410;--paper:#faf7f2;--cream:#f0ead8;--rule:#d4c9b8;
    --mid:#6b5e52;--mod:#1a56c4;--ml:#e8f0fe;--green:#2d7a1a;--gnl:#f0fae8;
    --blue:#01123a;--nav2:#0a1c44;--gold:#da9e2b;
  }
  html,body{height:100%;font-family:'DM Sans',sans-serif;font-weight:300;background:var(--cream);color:var(--ink)}
  button,select{cursor:pointer;font:inherit}
  .app{height:100vh;display:grid;grid-template-columns:70px 1fr;overflow:hidden}

  .rail{background:var(--blue);display:flex;flex-direction:column;align-items:center;padding:14px 8px;gap:6px}
  .brand{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--gold);color:var(--blue);font-weight:900;font-size:18px;margin-bottom:10px}
  .rail-btn{width:44px;height:44px;border:0;border-radius:11px;color:rgba(250,247,242,.55);background:transparent;font-size:21px;display:grid;place-items:center;position:relative;transition:background .15s,color .15s}
  .rail-btn:hover{background:var(--nav2);color:#fff}
  .rail-btn.active{background:var(--nav2);color:var(--gold)}
  .rail-btn .tip{position:absolute;left:56px;top:50%;transform:translateY(-50%) scale(.9);background:var(--ink);color:#fff;font-size:11px;font-weight:500;padding:5px 9px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:40}
  .rail-btn:hover .tip{opacity:1;transform:translateY(-50%) scale(1)}
  .rail-spacer{flex:1}

  .main{display:grid;grid-template-rows:auto 1fr;min-width:0;overflow:hidden}
  .statusbar{background:var(--blue);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:14px}
  .sb-logo img{height:24px;display:block}
  .sb-sep{color:rgba(255,255,255,.2)}
  .sb-status .lbl{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(218,158,43,.85);font-family:'DM Mono',monospace}
  .sb-status .val{font-size:13px;font-weight:500}
  .sb-r{margin-left:auto;display:flex;align-items:center;gap:12px}
  .sb-role{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);background:rgba(218,158,43,.12);border:1px solid rgba(218,158,43,.3);padding:3px 10px;border-radius:100px}
  .sb-name{font-size:13px;color:rgba(255,255,255,.85)}
  .sb-av{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600}
  .sb-signout{background:none;border:0;color:rgba(255,255,255,.55);font-size:18px;display:grid;place-items:center;padding:6px;border-radius:8px;transition:color .15s,background .15s}
  .sb-signout:hover{color:#fff;background:rgba(255,255,255,.1)}

  .canvas{overflow:auto;padding:26px 32px 48px}
  .greet-date{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);font-family:'DM Mono',monospace;margin-bottom:5px}
  .greet-h{font-family:'Playfair Display',serif;font-size:23px;font-weight:700;margin-bottom:4px;line-height:1.3}
  .greet-h em{font-style:italic;color:var(--mod)}
  .summary{font-size:13px;color:var(--mid);margin-bottom:22px}
  .wrap{max-width:1080px}

  .tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--rule)}
  .tab{padding:11px 18px;font-size:13px;font-weight:600;color:var(--mid);background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:8px;transition:color .15s}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--blue);border-bottom-color:var(--gold)}
  .tab .cnt{font-size:11px;color:var(--mid);background:var(--cream);border-radius:100px;padding:1px 8px;font-weight:600}
  .tab.active .cnt{background:var(--ml);color:var(--mod)}
  .tab.add{color:var(--mod)}.tab.add:hover{color:var(--blue)}

  .panel{background:#fff;border:1px solid var(--rule);border-top:0;border-radius:0 0 16px 16px}
  .panel-head{padding:22px 26px;border-bottom:1px solid #efeae0;display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .ph-l{flex:1;min-width:220px}
  .ph-name-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .ph-name{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--ink);line-height:1.15}
  .edit-name{background:none;border:0;color:var(--mid);font-size:16px;padding:5px;border-radius:6px;transition:color .15s,background .15s}
  .edit-name:hover{color:var(--mod);background:var(--ml)}
  .name-input{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--ink);border:1px solid var(--gold);border-radius:8px;padding:4px 10px;outline:none;box-shadow:0 0 0 3px rgba(218,158,43,.12)}
  .name-cancel{background:none;border:1px solid var(--rule);color:var(--mid);border-radius:8px;padding:8px 10px;font-size:14px}
  .ph-meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .ph-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mid)}
  .ph-chip i{font-size:15px;color:var(--mod)}
  .code-chip{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.14em;color:var(--blue);background:#f0f4fa;padding:3px 9px;border-radius:5px;border:1px solid #d0daea}
  .copy-btn{background:none;border:1px solid var(--rule);border-radius:6px;padding:3px 9px;font-size:11px;color:var(--mid);display:inline-flex;align-items:center;gap:4px;transition:background .12s,color .12s}
  .copy-btn:hover{background:var(--cream);color:var(--ink)}
  .copy-btn.copied{color:var(--green);border-color:#b6d9a8;background:var(--gnl)}
  .lesson-pick{display:flex;flex-direction:column;gap:5px;min-width:190px}
  .lesson-pick label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);font-family:'DM Mono',monospace}
  .lesson-pick select{border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:13px;background:#fff;color:var(--ink);outline:none}
  .lesson-pick select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(218,158,43,.12)}

  .lesson-band{position:relative;background:linear-gradient(150deg,#14213f,#25324d);color:#fff;padding:34px 24px;text-align:center;border-bottom:1px solid #efeae0}
  .lb-guide{position:absolute;right:20px;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--blue);background:var(--gold);text-decoration:none;padding:8px 14px;border-radius:100px;transition:.15s}
  .lb-guide:hover{filter:brightness(1.07)}
  .lb-guide i{font-size:15px}
  @media(max-width:640px){.lb-guide{position:static;transform:none;margin:14px auto 0;width:max-content}}
  .lesson-band .lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(218,158,43,.9);font-family:'DM Mono',monospace;margin-bottom:12px}
  .lesson-band .title{font-family:'Playfair Display',serif;font-size:34px;font-weight:900;line-height:1.1;margin-bottom:10px}
  .lesson-band .sub{font-size:15px;color:rgba(255,255,255,.72);font-family:'DM Mono',monospace;letter-spacing:.04em}

  .panel-body{padding:22px 26px}
  .blk{margin-bottom:26px}.blk:last-child{margin-bottom:0}
  .blk-h{font-size:16px;font-weight:600;letter-spacing:.01em;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .blk-h .note{font-size:11px;color:var(--mid);font-style:italic;font-weight:400}
  .suggest{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);background:var(--cream);border:1px solid var(--rule);padding:2px 8px;border-radius:100px;font-family:'DM Mono',monospace}

  .stu{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px}
  .stu:nth-child(odd){background:var(--paper)}
  .stu-av{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600;flex-shrink:0}
  .stu-main{min-width:0;flex:1}
  .stu-nm{font-size:15px;font-weight:600;color:var(--ink)}
  .stu-em{font-size:12px;color:var(--mid)}
  .stu-ind{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ind{font-size:11px;display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;border:1px solid var(--rule);color:var(--mid);background:#fff}
  .ind.mod{color:var(--mod);border-color:#c4d3ea;background:var(--ml)}
  .ind .dot{width:7px;height:7px;border-radius:50%;background:var(--rule)}
  .roster-empty{padding:16px 12px;font-size:12px;color:var(--mid);font-style:italic}
  .roster-cap{font-size:11px;color:var(--mid);margin-top:10px;font-style:italic}

  .teach-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media(max-width:760px){.teach-grid{grid-template-columns:1fr}}
  .tblk h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mod);margin-bottom:10px;font-weight:600;display:flex;align-items:center;gap:8px}
  .tblk ul{list-style:none;display:flex;flex-direction:column;gap:8px}
  .tblk li{font-size:14px;line-height:1.6;color:#3a332a;padding-left:16px;position:relative}
  .tblk li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
  .vocab li{padding-left:0}.vocab li::before{display:none}
  .vocab .term{font-weight:600;color:var(--ink)}.vocab .def{color:var(--mid)}
  .fm-title{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px;line-height:1.25}
  .fm-sum{font-size:14px;line-height:1.65;color:#3a332a}

  .create{padding:26px}
  .create label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);margin-bottom:6px;font-weight:500}
  .create input{width:100%;max-width:380px;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none}
  .create input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(218,158,43,.12)}
  .create-row{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;margin-top:6px}
  .btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:opacity .15s}
  .btn:hover{opacity:.9}.btn:disabled{opacity:.45}.btn.sm{padding:8px 11px;font-size:14px}

  .notes textarea{width:100%;min-height:120px;border:1px solid var(--rule);border-radius:10px;padding:12px 14px;font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.6;color:var(--ink);resize:vertical;outline:none}
  .notes textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(218,158,43,.12)}
  .notes-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
  .notes-foot .hint{font-size:11px;color:var(--mid)}
  .saved{font-size:11px;color:var(--green);opacity:0;transition:opacity .2s}.saved.show{opacity:1}

  #loading{padding:40px 32px;color:var(--mid);font-size:13px}
  #sdmain{display:none}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:100px;font-size:12px;z-index:60;transition:.2s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="loading">Loading your studio…</div>

<div class="app" id="sdmain">
  <aside class="rail">
    <div class="brand">C</div>
    <button class="rail-btn active" title="Studio Director"><i class="ti ti-home-2"></i><span class="tip">Studio Director</span></button>
    <button class="rail-btn" onclick="document.getElementById('sec-classes').scrollIntoView({behavior:'smooth'})"><i class="ti ti-school"></i><span class="tip">Classes</span></button>
    <button class="rail-btn" onclick="var n=document.getElementById('panel-notes');if(n)n.scrollIntoView({behavior:'smooth'})"><i class="ti ti-notes"></i><span class="tip">Instructor Notes</span></button>
    <div class="rail-spacer"></div>
  </aside>

  <div class="main">
    <div class="statusbar">
      <a class="sb-logo" href="studio-director.html"><img src="CPLA-logo-mark-rev.svg" alt="CPLA"></a>
      <div class="sb-sep">·</div>
      <div class="sb-status"><div class="lbl">Volume in progress</div><div class="val">Volume 1 · Foundations of Design Thinking</div></div>
      <div class="sb-r">
        <div class="sb-role">Studio Director</div>
        <div class="sb-name" id="sb-name">—</div>
        <div class="sb-av" id="sb-av">—</div>
        <button class="sb-signout" id="signout" title="Sign out"><i class="ti ti-logout"></i></button>
      </div>
    </div>

    <div class="canvas">
      <div class="wrap">
        <div class="greet-date" id="greet-date"></div>
        <div class="greet-h" id="greet-h">Here’s your studio.</div>
        <div class="summary" id="summary">—</div>
        <div class="section" id="sec-classes">
          <div class="tabs" id="tabs"></div>
          <div id="panel-host"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="data/lessons-v1.js"></script>
<script>
  function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1600);}
  function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  document.getElementById('signout').onclick=function(){auth.signOut().then(function(){window.location.href='login';});};

  var CURRENT_UID=null, classesData=[], activeTab=0;

  // Single source of truth for all instructor-facing lesson data — see data/lessons-v1.js.
  // Loaded via <script src="data/lessons-v1.js">, which sets window.CPLA_MODULES / window.CPLA_LESSONS.
  var MODULES=window.CPLA_MODULES;
  function modOf(L){return MODULES[L.mod]||MODULES["1"];}
  // Guide path/filename convention (all hyphenated): Guides/Volume-{volume}/instructor-guide-{volume}-{lesson}.html, lesson zero-padded to 2 digits (1-01 … 1-30).
  function guideHref(L){var p=L.id.split('.');var vol=p[0];var les=('0'+p[1]).slice(-2);return 'Guides/Volume-'+vol+'/instructor-guide-'+vol+'-'+les+'.html';}
  var LESSONS=window.CPLA_LESSONS;
  // Facilitation tips are suggested/general (not yet from an authored Instructor Guide).
  var GUIDE=["Open with a real object and ask “what problem does this solve, and for whom?”","Model the thinking out loud — narrate the choices, not just the steps.","Anchor every point back to audience and purpose.","Keep it low-stakes early; build curiosity before critique."];
  var HINTS=["Watch for “design = making things pretty” — redirect to purpose and audience.","Use think-pair-share for discussion questions to lower anxiety.","Praise the reasoning (“why”) more than the answer itself.","Have students name one well-designed and one poorly-designed everyday item."];

  auth.onAuthStateChanged(async function(user){
    if(!user){window.location.href='login';return;}
    CURRENT_UID=user.uid;
    var d={};
    try{ var s=await db.collection('users').doc(user.uid).get(); d=s.exists?s.data():{}; }catch(e){}
    if(d.accountType!=='instructor'){ window.location.href='workspace.html'; return; }
    var first=d.firstName||(user.displayName?user.displayName.split(' ')[0]:'Director');
    var initials=user.displayName?user.displayName.split(' ').map(function(n){return n[0];}).join('').toUpperCase().slice(0,2):user.email.slice(0,2).toUpperCase();
    document.getElementById('sb-name').textContent=user.displayName||first;
    document.getElementById('sb-av').textContent=initials;
    var now=new Date(), days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'], months=['January','February','March','April','May','June','July','August','September','October','November','December'];
    document.getElementById('greet-date').textContent=days[now.getDay()]+', '+months[now.getMonth()]+' '+now.getDate();
    var hr=now.getHours(), g=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
    document.getElementById('greet-h').innerHTML=g+', <em>'+esc(first)+'</em>. Here’s your studio.';
    await loadClasses(user.uid);
    document.getElementById('loading').style.display='none';
    document.getElementById('sdmain').style.display='grid';
  });

  function genCode(){var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='';for(var i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}

  async function loadClasses(uid){
    classesData=[];
    try{
      var snap=await db.collection('classes').where('instructorId','==',uid).get();
      var docs=snap.docs.slice().sort(function(a,b){var ta=a.data().createdAt?a.data().createdAt.toMillis():0,tb=b.data().createdAt?b.data().createdAt.toMillis():0;return ta-tb;});
      for(var i=0;i<docs.length;i++){
        var c=docs[i].data(); c.id=docs[i].id; c.students=[];
        try{ var rs=await db.collection('users').where('classId','==',c.id).get(); c.students=rs.docs.map(function(u){return u.data();}); }catch(e){ c.rosterError=true; }
        classesData.push(c);
      }
    }catch(e){}
    var total=classesData.reduce(function(a,c){return a+(c.students?c.students.length:0);},0);
    document.getElementById('summary').textContent=total+' student'+(total===1?'':'s')+' across '+classesData.length+' class'+(classesData.length===1?'':'es')+'.';
    renderTabs();
  }

  function renderTabs(){
    var tabs=document.getElementById('tabs'); tabs.innerHTML='';
    classesData.forEach(function(c,i){
      var b=document.createElement('button'); b.className='tab'+(i===activeTab?' active':'');
      b.innerHTML='<i class="ti ti-school"></i> '+esc(c.name)+' <span class="cnt">'+(c.students?c.students.length:0)+'</span>';
      b.onclick=function(){activeTab=i;renderTabs();}; tabs.appendChild(b);
    });
    var add=document.createElement('button'); add.className='tab add'+(activeTab===-1?' active':'');
    add.innerHTML='<i class="ti ti-plus"></i> New Class'; add.onclick=function(){activeTab=-1;renderTabs();}; tabs.appendChild(add);
    renderPanel();
  }

  function lessonById(id){ for(var i=0;i<LESSONS.length;i++) if(LESSONS[i].id===id) return LESSONS[i]; return LESSONS[0]; }

  function renderPanel(){
    var host=document.getElementById('panel-host');
    if(activeTab===-1 || !classesData.length){ host.innerHTML=createPanelHTML(); wireCreate(); return; }
    var c=classesData[activeTab]; if(!c){activeTab=0;c=classesData[0];}
    var L=lessonById(c.currentLesson||LESSONS[0].id);
    host.innerHTML=classPanelHTML(c,L);
    var copy=host.querySelector('.copy-btn');
    if(copy) copy.onclick=function(){ navigator.clipboard.writeText(c.inviteCode).then(function(){ copy.classList.add('copied'); copy.innerHTML='<i class="ti ti-check"></i> Copied'; setTimeout(function(){copy.classList.remove('copied');copy.innerHTML='<i class="ti ti-copy"></i> Copy code';},1800); }); };
    var eb=host.querySelector('#edit-name'); if(eb) eb.onclick=function(){startNameEdit(c);};
    var sel=host.querySelector('#lesson-select'); if(sel) sel.onchange=function(){ setCurrentLesson(c, sel.value); };
    loadPanelNotes(c,L);
  }

  function classPanelHTML(c,L){
    var M=modOf(L);
    var roster;
    if(c.rosterError){ roster='<div class="roster-empty">Could not load roster — check the Firestore rules (instructor read access).</div>'; }
    else if(!c.students.length){ roster='<div class="roster-empty">No students enrolled yet. Share the invite code above so students can register.</div>'; }
    else{
      roster=c.students.map(function(x){
        var ini=((x.firstName?x.firstName[0]:'')+(x.lastName?x.lastName[0]:'')||'?').toUpperCase();
        var nm=esc(((x.firstName||'')+' '+(x.lastName||'')).trim()||'Student');
        return '<div class="stu"><div class="stu-av">'+ini+'</div><div class="stu-main"><div class="stu-nm">'+nm+'</div><div class="stu-em">'+esc(x.email||'')+'</div></div><div class="stu-ind"><span class="ind mod">Lesson '+L.id+'</span><span class="ind"><span class="dot"></span> Not started</span></div></div>';
      }).join('');
      roster+='<div class="roster-cap">Live status (Learning · Practicing · Creating · Reviewing · Awaiting Feedback · Certified) activates once progress tracking is turned on.</div>';
    }
    var groups={}, order=[];
    LESSONS.forEach(function(x){var k=x.mod||"1"; if(!groups[k]){groups[k]=[];order.push(k);} groups[k].push(x);});
    var options=order.map(function(k){
      var opts=groups[k].map(function(x){return '<option value="'+x.id+'"'+(x.id===L.id?' selected':'')+'>Lesson '+x.id+' — '+esc(x.title)+'</option>';}).join('');
      var mm=MODULES[k]||MODULES["1"];
      return '<optgroup label="'+esc(mm.module+' — '+mm.moduleTitle)+'">'+opts+'</optgroup>';
    }).join('');
    var objectives=L.curriculum.objectives.map(function(o){return '<li>'+esc(o)+'</li>';}).join('');
    var vocab=L.curriculum.vocab.map(function(v){return '<li><span class="term">'+esc(v[0])+'</span> — <span class="def">'+esc(v[1])+'</span></li>';}).join('');
    var guide=GUIDE.map(function(t){return '<li>'+esc(t)+'</li>';}).join('');
    var hints=HINTS.map(function(t){return '<li>'+esc(t)+'</li>';}).join('');
    return '<div class="panel">'+
      '<div class="panel-head">'+
        '<div class="ph-l">'+
          '<div class="ph-name-row"><span class="ph-name" id="ph-name">'+esc(c.name)+'</span><button class="edit-name" id="edit-name" title="Rename class"><i class="ti ti-pencil"></i></button></div>'+
          '<div class="ph-meta">'+
            '<span class="ph-chip"><i class="ti ti-users"></i> '+c.students.length+' student'+(c.students.length===1?'':'s')+'</span>'+
            '<span class="ph-chip"><span class="code-chip">'+esc(c.inviteCode)+'</span><button class="copy-btn"><i class="ti ti-copy"></i> Copy code</button></span>'+
          '</div>'+
        '</div>'+
        '<div class="lesson-pick"><label>Class is currently on</label><select id="lesson-select">'+options+'</select></div>'+
      '</div>'+
      '<div class="lesson-band"><div class="lbl">'+M.volume+' · '+M.module+' · Lesson '+L.id+'</div><div class="title">'+esc(L.title)+'</div><div class="sub">'+esc(M.moduleTitle)+'</div><a class="lb-guide" href="'+guideHref(L)+'" target="_blank" title="Open the full instructor guide for this lesson"><i class="ti ti-book-2"></i> Lesson Guide</a></div>'+
      '<div class="panel-body">'+
        '<div class="blk"><div class="blk-h">Roster &amp; Status</div>'+roster+'</div>'+
        '<div class="blk"><div class="blk-h">Teaching Lesson '+L.id+' <span class="note">— '+esc(L.title)+'</span></div>'+
          '<div class="teach-grid">'+
            '<div class="tblk"><h4>Lesson Objectives</h4><ul>'+objectives+'</ul></div>'+
            '<div class="tblk"><h4>Key Vocabulary</h4><ul class="vocab">'+vocab+'</ul></div>'+
          '</div>'+
          '<div class="teach-grid" style="margin-top:22px">'+
            '<div class="tblk"><h4>Instructor Guide Tips <span class="suggest">suggested</span></h4><ul>'+guide+'</ul></div>'+
            '<div class="tblk"><h4>Helpful Hints <span class="suggest">suggested</span></h4><ul>'+hints+'</ul></div>'+
          '</div>'+
          '<div class="teach-grid" style="margin-top:22px">'+
            '<div class="tblk"><h4>Field Manual Exercise</h4><div class="fm-title">'+esc(L.curriculum.fieldManual.title)+'</div><p class="fm-sum">'+esc(L.curriculum.fieldManual.summary)+'</p></div>'+
            '<div class="tblk"><h4>Assignment &amp; Deliverable</h4><div class="fm-title">'+esc(L.curriculum.deliverable.title)+'</div><p class="fm-sum">'+esc(L.curriculum.deliverable.summary)+'</p></div>'+
          '</div>'+
        '</div>'+
        '<div class="blk notes" id="panel-notes"><div class="blk-h">Instructor Notes <span class="note">— private · '+M.volume+' · '+M.module+' · Lesson '+L.id+'</span></div>'+
          '<textarea id="panel-notes-text"></textarea>'+
          '<div class="notes-foot"><span class="hint">Notes are saved per class and per lesson, so they trace back to '+M.module+' · Lesson '+L.id+'.</span><span class="saved" id="panel-notes-saved"><i class="ti ti-check"></i> Saved</span></div>'+
        '</div>'+
      '</div>'+
    '</div>';
  }

  function createPanelHTML(){
    return '<div class="panel"><div class="create"><label for="new-class">'+(classesData.length?'Create a new class':'No classes yet — create your first one')+'</label><div class="create-row"><input type="text" id="new-class" placeholder="e.g. Digital Design 2026–27"><button class="btn" id="create-btn"><i class="ti ti-plus"></i> Create Class</button></div></div></div>';
  }

  function startNameEdit(c){
    var row=document.querySelector('.ph-name-row'); if(!row) return;
    row.innerHTML='<input class="name-input" id="name-input"><button class="btn sm" id="name-save"><i class="ti ti-check"></i></button><button class="name-cancel" id="name-cancel"><i class="ti ti-x"></i></button>';
    var inp=document.getElementById('name-input'); inp.value=c.name; inp.focus(); inp.select();
    document.getElementById('name-save').onclick=function(){ saveName(c, inp.value.trim()); };
    document.getElementById('name-cancel').onclick=function(){ renderPanel(); };
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){saveName(c, inp.value.trim());} if(e.key==='Escape'){renderPanel();} });
  }
  async function saveName(c,name){ if(!name)return; try{ await db.collection('classes').doc(c.id).update({name:name}); c.name=name; toast('Class renamed'); renderTabs(); }catch(e){ toast('Could not rename — check permissions'); } }

  async function setCurrentLesson(c,lid){ c.currentLesson=lid; try{ await db.collection('classes').doc(c.id).update({currentLesson:lid}); toast('Now on Lesson '+lid); }catch(e){} renderPanel(); }

  function wireCreate(){
    var inp=document.getElementById('new-class'), btn=document.getElementById('create-btn'); if(!btn)return;
    btn.onclick=async function(){
      var name=inp.value.trim(); if(!name){inp.focus();return;}
      btn.disabled=true; btn.innerHTML='Creating…';
      try{ var ref=await db.collection('classes').add({name:name,inviteCode:genCode(),instructorId:CURRENT_UID,active:true,currentLesson:LESSONS[0].id,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
        toast('Class created'); await loadClasses(CURRENT_UID);
        var idx=classesData.findIndex(function(c){return c.id===ref.id;}); activeTab=idx>=0?idx:0; renderTabs();
      }catch(e){ toast('Could not create class'); btn.disabled=false; btn.innerHTML='<i class="ti ti-plus"></i> Create Class'; }
    };
    if(inp) inp.addEventListener('keydown',function(e){if(e.key==='Enter')btn.onclick();});
  }

  // NOTES — per class + per lesson (doc id starts with uid so rules pass)
  var notesTimer=null;
  function notesId(c,L){ return CURRENT_UID+'_'+c.id+'_'+L.id; }
  async function loadPanelNotes(c,L){
    var ta=document.getElementById('panel-notes-text'); if(!ta) return;
    var M=modOf(L); var stamp='['+M.volume+' · '+M.module+' · Lesson '+L.id+' — '+L.title+']\n\n';
    try{ var s=await db.collection('instructor_notes').doc(notesId(c,L)).get(); ta.value=(s.exists&&s.data().text)?s.data().text:stamp; }
    catch(e){ ta.value=stamp; }
    ta.oninput=function(){
      clearTimeout(notesTimer);
      notesTimer=setTimeout(async function(){
        try{ await db.collection('instructor_notes').doc(notesId(c,L)).set({text:ta.value,classId:c.id,lessonId:L.id,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
          var sv=document.getElementById('panel-notes-saved'); if(sv){sv.classList.add('show');setTimeout(function(){sv.classList.remove('show');},1500);}
        }catch(e){}
      },800);
    };
  }
</script>
</body>
</html>
