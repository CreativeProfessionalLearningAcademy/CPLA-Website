<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPLA — Creative Professional Learning Academy</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue:       #01123a;
      --gold:       #da9e2b;
      --gold-light: #e8b84b;
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--blue);
      color: #ffffff;
      overflow: hidden;
    }

    /* Subtle gold radial glow behind logo */
    .bg-glow {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse at 50% 42%, rgba(218,158,43,.08) 0%, transparent 62%);
      pointer-events: none;
    }

    /* Ghost mark watermark — uses the actual SVG mark at very low opacity */
    .bg-watermark {
      position: fixed;
      bottom: -80px; right: -60px;
      width: clamp(300px, 45vw, 560px);
      opacity: .03;
      pointer-events: none;
      z-index: 0;
    }

    /* ── CENTERED STAGE ── */
    .stage {
      position: relative; z-index: 1;
      height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 24px;
      text-align: center;
      gap: 0;
    }

    /* ── LOGO ── */
    .logo-img {
      width: clamp(280px, 42vw, 460px);
      height: auto;
      display: block;
      margin-bottom: 40px;
    }

    /* ── BUTTONS ── */
    .btn-row {
      display: flex; align-items: center;
      gap: 14px; flex-wrap: wrap;
      justify-content: center;
    }

    .btn-primary {
      display: inline-flex; align-items: center; gap: 9px;
      background: var(--gold);
      color: var(--blue);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 600;
      padding: 13px 30px;
      border-radius: 7px;
      text-decoration: none;
      letter-spacing: .02em;
      transition: background .15s, transform .15s, box-shadow .15s;
      box-shadow: 0 4px 24px rgba(218,158,43,.28);
    }
    .btn-primary:hover {
      background: var(--gold-light);
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(218,158,43,.4);
    }
    .btn-primary svg { width: 16px; height: 16px; flex-shrink: 0; }

    .btn-ghost {
      display: inline-flex; align-items: center; gap: 9px;
      background: transparent;
      color: rgba(255,255,255,.6);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 400;
      padding: 13px 28px;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,.2);
      text-decoration: none;
      letter-spacing: .02em;
      transition: color .15s, border-color .15s, transform .15s;
    }
    .btn-ghost:hover {
      color: rgba(255,255,255,.9);
      border-color: rgba(255,255,255,.45);
      transform: translateY(-1px);
    }
    .btn-ghost svg { width: 14px; height: 14px; flex-shrink: 0; opacity: .6; }

    /* ── FOOTER ── */
    .landing-footer {
      position: absolute; bottom: 24px; left: 0; right: 0;
      text-align: center;
      font-family: 'DM Mono', monospace;
      font-size: 10px; letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(255,255,255,.12);
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <!-- Ghost watermark using the actual mark SVG -->
  <img src="CPLA-logo-mark-rev.svg" class="bg-watermark" alt="" aria-hidden="true">

  <div class="stage">

    <!-- Full logo (mark + CPLA letters + full name + tagline) on dark background -->
    <img
      src="CPLA-logo-full-rev.svg"
      class="logo-img"
      alt="Creative Professional Learning Academy"
    >

    <div class="btn-row">
      <a href="index.html" class="btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Sign In
      </a>
      <a href="about.html" class="btn-ghost">
        Learn More
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </a>
    </div>

  </div>

  <div class="landing-footer">&copy; 2026 Creative Professional Learning Academy</div>

</body>
</html>
